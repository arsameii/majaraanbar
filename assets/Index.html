<!doctype html>
<html lang="fa" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موجودی انبار — ماجرا بوک</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1d1d1b;--mu:#77756e;--bd:#e4e1d8;--ac:#2f6f5e;--ok:#2f7d4f;--lo:#b7791f;--no:#b83a3a;--sl:#e3f1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--cd:#212120;--tx:#efeee9;--mu:#9a988f;--bd:#333330;--ac:#5fb59c;--ok:#67c08a;--lo:#e0aa4a;--no:#e27a7a;--sl:#1f332d}}
:root[data-theme="dark"]{--bg:#161615;--cd:#212120;--tx:#efeee9;--mu:#9a988f;--bd:#333330;--ac:#5fb59c;--ok:#67c08a;--lo:#e0aa4a;--no:#e27a7a;--sl:#1f332d}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{max-width:640px;margin:0 auto;padding:14px 14px 120px}
h1{font-size:22px;margin:4px 0 0;font-weight:700;letter-spacing:-.2px}
.sub{color:var(--mu);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:8px 14px;transition:transform .12s,box-shadow .12s,background .12s}
button:active{transform:scale(.96)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;box-shadow:0 2px 8px -2px color-mix(in srgb,var(--ac) 55%,transparent)}
input{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:9px 12px;min-width:0;transition:border-color .12s}
input:focus{outline:none;border-color:var(--ac)}
#q{width:100%;margin:12px 0 8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{white-space:nowrap;border-radius:99px;padding:7px 14px;transition:all .12s}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 2px 8px -2px color-mix(in srgb,var(--ac) 55%,transparent)}
.chip small{opacity:.7}
.row{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:border-color .12s,transform .1s}
.row[data-a="sel"]{cursor:pointer}
.row[data-a="sel"]:active{transform:scale(.99)}
.row.sel{background:var(--sl);border-color:var(--ac)}
.ck{width:20px;height:20px;border:2px solid var(--bd);border-radius:6px;flex:none;transition:all .12s}
.sel .ck{background:var(--ac);border-color:var(--ac)}
.nm{flex:1;min-width:0;font-weight:500}
.nm em{display:block;font-style:normal;color:var(--mu);font-size:12px;font-weight:400}
.q{font-size:18px;min-width:34px;text-align:center;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.q.lo{color:var(--lo)}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid currentColor;flex:none}
.tag.ok{color:var(--ok)}.tag.lo{color:var(--lo)}.tag.no{color:var(--no)}
.ed input.nmi{flex:1}
.ed input.qi{width:64px;text-align:center}
.ed button{padding:6px 12px}
.x{color:var(--no)}
.hd{display:flex;align-items:center;gap:12px}
.hd img{width:54px;height:54px;flex:none}
.row.off{opacity:.55;cursor:not-allowed}
.row.off .ck{border-style:dashed}
.cnt{background:var(--ac);color:#fff;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:600;flex:none}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(2px)}
.sh{background:var(--cd);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.12)}
.sh{max-height:85vh;overflow:auto}
.sh ul{margin:10px 0;padding:0 20px}
.warn{color:var(--lo);font-size:13px}
.sh h2{font-size:18px;margin:0 0 2px}
.step{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0}
.step button{width:48px;height:48px;font-size:22px;padding:0}
.step input{width:84px;text-align:center;font-size:20px}
.sh .acts button{flex:1}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:10px;border:1px dashed var(--bd);border-radius:12px}
.tools input{flex:1;min-width:110px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:640px;margin:0 auto}
.bar ul{margin:0 0 8px;padding:0 18px;max-height:110px;overflow:auto;font-size:14px}
.acts{display:flex;gap:8px;align-items:center}
.acts b{flex:1}
#msg{color:var(--ac);font-size:13px;min-height:20px}

.hb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hb button{padding:6px 12px;font-size:14px}
</style>
</head>
<body>
<div id="root"></div>
<script>
// اگر این فایل را جدا از Apps Script باز می‌کنید، آدرس Web app را اینجا بگذارید:
const API_URL='PASTE_YOUR_WEB_APP_URL_HERE';
const GS=typeof google!=='undefined'&&google.script&&google.script.run;
const S={cats:[],items:[],updated:null};
let cat=null,q='',edit=false,sel={},pick=null,stage=null,done=null,busy=false,armed=false,loaded=false,failed=false,rid=null,pw='',admin=false,loginErr='';
try{pw=localStorage.getItem('anbar_pw')||'';admin=!!pw}catch(_){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n).toLocaleString('fa-IR');
const num=v=>{v=String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));const n=parseInt(v,10);return isNaN(n)||n<0?0:n};
const uid=()=>Math.random().toString(36).slice(2,10);
const cname=id=>(S.cats.find(c=>c.id===id)||{}).name||'';
const item=id=>S.items.find(i=>i.id===id);
function msg(t){const m=$('#msg');if(!m)return;m.textContent=t;setTimeout(()=>{if(m.textContent===t)m.textContent=''},4000)}
function gs(fn,arg){return new Promise((ok,no)=>{const r=google.script.run.withSuccessHandler(ok).withFailureHandler(no);arg===undefined?r[fn]():r[fn](arg)})}
async function post(b){if(GS)return gs('api_post',JSON.stringify(b));const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return r.json()}
async function fetchAll(){if(GS)return gs('api_get');const r=await fetch(API_URL+'?api=1');return r.json()}
function apply(d){
  S.cats=d.cats||[];S.updated=d.updated||null;
  S.items=(d.items||[]).sort((a,b)=>(a.created||0)-(b.created||0)||String(a.name).localeCompare(b.name,'fa'));
  if(!S.cats.find(c=>c.id===cat))cat=S.cats[0]&&S.cats[0].id;
}
async function load(){
  try{apply(await fetchAll());loaded=true;failed=false}catch(_){failed=true}
  render();
}
function logout(){admin=false;edit=false;pw='';try{localStorage.removeItem('anbar_pw')}catch(_){}}
async function adm(op,d){
  try{
    const r=await post(Object.assign({action:'admin',op,password:pw},d||{}));
    if(r.error==='bad_password'){logout();msg('رمز مدیر درست نیست')}
    else if(r.error)msg('خطا: '+r.error);
    else{apply(r);if(r.newCat)cat=r.newCat}
  }catch(_){msg('ذخیره نشد؛ اینترنت را بررسی کنید')}
  render();
}

function modal(){
  const it=pick&&item(pick.id),picked=S.items.filter(i=>sel[i.id]);
  if(stage==='login')return '<div class="mo"><div class="sh"><h2>ورود مدیر</h2><div class="sub">رمز مدیر را وارد کنید.</div><div class="step"><input id="pw" type="password" style="width:100%;font-size:16px" placeholder="رمز"></div>'+(loginErr?'<div class="warn">'+loginErr+'</div>':'')+'<div class="acts"><button class="pri" data-a="dologin"'+(busy?' disabled':'')+'>ورود</button><button data-a="rback">انصراف</button></div></div></div>';
  if(it)return '<div class="mo" data-a="pcancel"><div class="sh"><h2>'+esc(it.name)+'</h2><div class="sub">موجودی انبار: '+fa(it.qty)+' عدد</div><div class="sub" style="margin-top:14px">چند تا می‌خواهی؟</div><div class="step"><button data-a="pdec">−</button><input inputmode="numeric" data-a="pnum" value="'+pick.n+'"><button data-a="pinc">+</button></div><div class="acts"><button class="pri" data-a="pok">'+(sel[it.id]?'به‌روزرسانی':'افزودن به لیست')+'</button>'+(sel[it.id]?'<button class="x" data-a="prem">حذف از لیست</button>':'')+'<button data-a="pcancel">انصراف</button></div></div></div>';
  if(stage==='review')return '<div class="mo"><div class="sh"><h2>تایید لیست</h2><div class="sub">با تایید نهایی، این تعداد از موجودی انبار کم می‌شود.</div><ul>'+picked.map(i=>'<li>'+esc(i.name)+' <b>× '+fa(sel[i.id])+'</b></li>').join('')+'</ul><div class="acts"><button class="pri" data-a="final"'+(busy?' disabled':'')+'>'+(busy?'در حال ثبت…':'تایید نهایی')+'</button><button data-a="rback"'+(busy?' disabled':'')+'>بازگشت</button></div></div></div>';
  if(stage==='done'&&done)return '<div class="mo"><div class="sh"><h2>ثبت شد ✅</h2><div class="sub">این موارد از موجودی انبار کم شد:</div><ul>'+done.map(r=>'<li>'+esc(r.name)+' <b>× '+fa(r.got)+'</b>'+(r.got<r.want?' <span class="warn">(از '+fa(r.want)+' تا فقط '+fa(r.got)+' تا موجود بود)</span>':'')+'</li>').join('')+'</ul><div class="acts"><button class="pri" data-a="copy">کپی لیست</button><button data-a="close">بستن</button></div></div></div>';
  return '';
}
function render(){
  const keep=['nn','nq','nc'].map(i=>{const e=$('#'+i);return e?e.value:''});
  $('#upd').textContent=S.updated?'آخرین به‌روزرسانی: '+new Date(S.updated).toLocaleString('fa-IR',{weekday:'long',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  $('#ebtn').innerHTML='<button data-a="reload" title="به‌روزرسانی">↻</button>'+(admin?'<button data-a="edit">'+(edit?'خروج از ویرایش':'✏️ ویرایش')+'</button>'+(edit?'<button data-a="logout">خروج مدیر</button>':''):'<button data-a="login">🔒 مدیر</button>');
  $('#chips').innerHTML=S.cats.map(c=>'<button class="chip '+(c.id===cat&&!q?'on':'')+'" data-a="cat" data-id="'+c.id+'">'+esc(c.name)+' <small>'+fa(S.items.filter(i=>i.cat===c.id).length)+'</small></button>').join('');
  let t='';
  if(edit){
    t+='<div class="tools"><input id="nn" placeholder="نام جنس جدید"><input id="nq" inputmode="numeric" placeholder="موجودی" style="max-width:90px"><button class="pri" data-a="add">افزودن</button></div>';
    t+='<div class="tools"><input id="nc" placeholder="دسته‌بندی جدید"><button data-a="addcat">افزودن دسته</button>'+(cat?'<button class="x" data-a="delcat">'+(armed?'مطمئنی؟ (حذف دسته و اجناسش)':'حذف این دسته')+'</button>':'')+'</div>';
  }
  $('#tools').innerHTML=t;
  ['nn','nq','nc'].forEach((i,k)=>{const e=$('#'+i);if(e)e.value=keep[k]});
  let list;
  if(!GS&&API_URL.indexOf('PASTE')>=0)list='<div class="empty">آدرس اتصال (API_URL) هنوز در فایل تنظیم نشده است.</div>';
  else if(!loaded)list='<div class="empty">'+(failed?'اتصال برقرار نیست. اینترنت را بررسی کنید و ↻ را بزنید.':'در حال بارگذاری…')+'</div>';
  else{
    const items=q?S.items.filter(i=>i.name.includes(q)):S.items.filter(i=>i.cat===cat);
    list=items.length?items.map(i=>{
      if(edit)return '<div class="row ed"><input class="nmi" data-a="name" data-id="'+i.id+'" value="'+esc(i.name)+'"><button data-a="dec" data-id="'+i.id+'">−</button><input class="qi" inputmode="numeric" data-a="qty" data-id="'+i.id+'" value="'+i.qty+'"><button data-a="inc" data-id="'+i.id+'">+</button><button class="x" data-a="del" data-id="'+i.id+'">×</button></div>';
      const off=i.qty<=0;
      return '<div class="row '+(off?'off':sel[i.id]?'sel':'')+'"'+(off?'':' data-a="sel" data-id="'+i.id+'"')+'><span class="ck"></span><div class="nm">'+esc(i.name)+(q?'<em>'+esc(cname(i.cat))+'</em>':'')+'</div>'+(sel[i.id]&&!off?'<span class="cnt">× '+fa(sel[i.id])+'</span>':'')+(off?'<span class="tag no">ناموجود</span>':'<b class="q'+(i.qty<=5?' lo':'')+'">'+fa(i.qty)+'</b>')+'</div>';
    }).join(''):'<div class="empty">'+(q?'چیزی پیدا نشد':'این دسته هنوز جنسی ندارد')+'</div>';
  }
  $('#list').innerHTML=list;
  const picked=S.items.filter(i=>sel[i.id]),bar=$('#bar');
  bar.hidden=!picked.length||edit;
  bar.innerHTML='<div><ul>'+picked.map(i=>'<li>'+esc(i.name)+' <span class="sub">('+esc(cname(i.cat))+')</span> × '+fa(sel[i.id])+'</li>').join('')+'</ul><div class="acts"><b>'+fa(picked.length)+' مورد انتخاب شده</b><button data-a="clear">پاک کردن</button><button class="pri" data-a="review">تایید</button></div></div>';
  $('#modal').innerHTML=modal();
  const p=$('#pw');if(p)p.focus();
}
async function finalize(){
  busy=true;render();
  rid=rid||uid();
  const picked=S.items.filter(i=>sel[i.id]).map(i=>({id:i.id,name:i.name,want:sel[i.id]}));
  try{
    const r=await post({action:'take',rid,lines:picked.map(p=>({id:p.id,n:p.want}))});
    if(r.error||!r.results)throw 0;
    apply(r.data);
    done=picked.map(p=>({name:p.name,want:p.want,got:(r.results.find(x=>x.id===p.id)||{}).got||0}));
    sel={};stage='done';rid=null;
  }catch(_){msg('ثبت نشد؛ اینترنت را بررسی کنید و دوباره «تایید نهایی» را بزنید')}
  busy=false;render();
}
async function login(){
  const v=($('#pw')||{}).value||'';if(!v)return;
  busy=true;loginErr='';render();
  try{
    const r=await post({action:'admin',op:'check',password:v});
    if(r.ok){pw=v;admin=true;stage=null;try{localStorage.setItem('anbar_pw',v)}catch(_){}}
    else loginErr='رمز درست نیست';
  }catch(_){loginErr='اتصال برقرار نشد'}
  busy=false;render();
}
async function onClick(e){
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id,it=item(id);
  if(a==='cat'){cat=id;q='';$('#q').value='';armed=false}
  else if(a==='reload'){load();return}
  else if(a==='login'){stage='login';loginErr=''}
  else if(a==='dologin'){return login()}
  else if(a==='logout'){logout()}
  else if(a==='sel'){if(it&&it.qty>0)pick={id,n:Math.min(sel[id]||1,it.qty)}}
  else if(a==='pcancel'){if(el.classList.contains('mo')&&e.target!==el)return;pick=null}
  else if(a==='pinc'){pick.n=Math.min(item(pick.id).qty,pick.n+1)}
  else if(a==='pdec'){pick.n=Math.max(1,pick.n-1)}
  else if(a==='pok'){sel[pick.id]=pick.n;pick=null}
  else if(a==='prem'){delete sel[pick.id];pick=null}
  else if(a==='pnum'){return}
  else if(a==='clear'){sel={}}
  else if(a==='review'){stage='review'}
  else if(a==='rback'){stage=null}
  else if(a==='final'){return finalize()}
  else if(a==='close'){stage=null;done=null}
  else if(a==='copy'){
    const txt=(done||[]).filter(r=>r.got>0).map(r=>'• '+r.name+' — تعداد: '+r.got).join('\n');
    try{await navigator.clipboard.writeText(txt);msg('لیست کپی شد')}
    catch(_){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');msg('لیست کپی شد')}catch(_){msg('کپی نشد')}t.remove()}
    return;
  }
  else if(a==='edit'){edit=!edit;armed=false}
  else if(a==='inc'&&it){return adm('adjust',{id,delta:1})}
  else if(a==='dec'&&it){return adm('adjust',{id,delta:-1})}
  else if(a==='del'){return adm('delete',{id})}
  else if(a==='add'){
    const n=$('#nn').value.trim();if(!n||!cat)return;
    const qv=num($('#nq').value);$('#nn').value='';$('#nq').value='';
    return adm('add',{cat,name:n,qty:qv});
  }
  else if(a==='addcat'){
    const n=$('#nc').value.trim();if(!n)return;$('#nc').value='';
    return adm('addcat',{name:n});
  }
  else if(a==='delcat'){
    if(!armed){armed=true;render();return}
    armed=false;return adm('delcat',{id:cat});
  }
  else return;
  render();
}
function onChange(e){
  const el=e.target,a=el.dataset.a;
  if(a==='pnum'&&pick){pick.n=Math.min(item(pick.id).qty,Math.max(1,num(el.value)));render();return}
  const it=item(el.dataset.id);if(!it)return;
  if(a==='name'){const n=el.value.trim();if(n)adm('update',{id:it.id,name:n})}
  else if(a==='qty'){adm('update',{id:it.id,qty:num(el.value)})}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&stage==='login')login()});
init();
</script>
